[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forever-addons"
version = "0.1.0"
description = "Command-line WoW Forever addon manager for CurseForge and GitHub releases, multi-install, with local patches."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
forever-addons = "forever_addons.cli:main"

[tool.setuptools]
packages = ["forever_addons"]
